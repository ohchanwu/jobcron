# Production deployment stack for https://jobcron.app.
#
# This compose file intentionally differs from deploy/demo:
# - pulls a prebuilt image instead of building on EC2
# - uses AWS RDS PostgreSQL through DATABASE_URL
# - runs the private owner-login app, not read-only demo mode
# - leaves Worknet disabled for the first pass
services:
  app:
    image: "${JOBCRON_IMAGE:?set JOBCRON_IMAGE in .env}"
    pull_policy: never
    command:
      - --no-open
      - --host
      - 0.0.0.0
      - --port
      - "7777"
    environment:
      JOBCRON_ENV: production
      JOBCRON_HOST: 0.0.0.0
      JOBCRON_PORT: "7777"
      JOBCRON_NO_OPEN: "1"
      DATABASE_URL_FILE: /run/jobcron/secrets/DATABASE_URL
      SESSION_SECRET_FILE: /run/jobcron/secrets/SESSION_SECRET
      JOBCRON_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/jobcron/secrets/JOBCRON_CREDENTIAL_ENCRYPTION_KEY
      JOBCRON_SCHEDULER_ENABLED: "1"
      JOBCRON_DAILY_SCRAPE_TIME: "${JOBCRON_DAILY_SCRAPE_TIME:-05:00}"
      JOBCRON_SIGNUP_ACCESS_CODE_FILE: /run/jobcron/secrets/JOBCRON_SIGNUP_ACCESS_CODE
      JOBCRON_STAGE1_SPONSOR_USER_ID: >-
        ${JOBCRON_STAGE1_SPONSOR_USER_ID:?set JOBCRON_STAGE1_SPONSOR_USER_ID in .env}
      JOBCRON_PROXY_SECRET_FILE: /run/jobcron/secrets/JOBCRON_PROXY_SECRET
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - /run/jobcron/secrets:/run/jobcron/secrets:ro
      - type: bind
        source: /run/jobcron/rds-ca.pem
        target: /run/jobcron/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 7777
        published: "7777"
        host_ip: 127.0.0.1
        protocol: tcp
    expose:
      - "7777"
    networks:
      - runtime
      - outbound
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ulimits:
      core:
        hard: 0
        soft: 0
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    ports:
      - target: 443
        published: "443"
        host_ip: 0.0.0.0
        protocol: tcp
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /run/jobcron/caddy:/run/jobcron/caddy:ro
    read_only: true
    tmpfs:
      - /data:mode=0700
      - /config:mode=0700
      - /tmp:mode=0700
    networks:
      - runtime
      - outbound
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ulimits:
      core:
        hard: 0
        soft: 0
    restart: unless-stopped

networks:
  runtime:
    internal: true
  outbound:
    driver: bridge
